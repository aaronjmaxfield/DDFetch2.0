<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DDFETCH 2.0</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The DDFetch mark: the white D-and-magnifier on teal (#0f766e), with a
       drop shadow and a gold star on the corner. Deliberately not the brand
       purple: Datadog's favicon is a white mark on purple, and a purple tile
       looked identical to a Datadog tab. Chosen after comparing colourings at
       16px beside real Datadog tabs on light and dark tab bars. The 512px
       master and its generator script are kept with the project's design
       files. The .ico carries 16/32/48 for tabs and bookmarks; the 192px PNG
       is what high-DPI screens and "add to home screen" pick. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <!-- 700 is load-bearing: the styles and every <strong> ask for bold, and
       without a real bold face the browser synthesises one by smearing the
       regular glyphs -- visibly fuzzy at the 11-12px the notes use. Added
       2026-09-22 after exactly that was reported. 600 resolves to 700. -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome provides the help icon. Moved here from the component
       template, which also used to pull in a conflicting Bootstrap 4. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
